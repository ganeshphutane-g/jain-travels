<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Jain Travels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand">
      <span class="brand-logo" aria-hidden="true">JT</span>
      <span class="brand-name">Jain Travels</span>
    </a>

    <nav class="nav-menu" aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#booking">Book</a></li>
        <li><a href="index.html#packages">Packages</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#gallery">Gallery</a></li>
        <li><a href="index.html#about">About</a></li>
      </ul>
    </nav>

    <div class="nav-auth">
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-filled">Register</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Login</h1>
      <p class="auth-subtitle">Welcome back! Sign in to your Jain Travels account.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Email ID</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <p id="form-error" class="auth-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-filled auth-submit">Login</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
